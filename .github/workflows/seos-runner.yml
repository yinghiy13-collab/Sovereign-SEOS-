name: Sovereign SEOS Runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write
  pages: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref_name }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"

      - name: Run SEOS Self-Test
        run: python3 seos.py self

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate attestation
        run: python3 seos.py attest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign attestation (keyless)
        run: |
          cosign sign-blob --yes attestation.json \
            --bundle attestation.sigstore.json

      - name: Verify attestation (Zero-Trust Check)
        run: |
          cosign verify-blob \
            --bundle attestation.sigstore.json \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            attestation.json

      - name: Native GitHub attestation
        if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'attestation.json'

      - name: Generate Trust Dashboard
        run: python3 generate_dashboard.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seos-attestation-${{ github.sha }}
          path: |
            attestation.json
            attestation.sigstore.json
          retention-days: 90

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
