name: SEOS Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Runner: ${{ runner.os }}"

      - name: Run SEOS
        run: |
          python seos.py

      - name: Generate attestation
        run: |
          # คำสั่งสำหรับสร้าง attestation.json (จากระบบของคุณ)
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign attestation (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle attestation.sigstore.json \
            attestation.json

      - name: Verify attestation (Zero-Trust Check)
        run: |
          cosign verify-blob \
            --bundle attestation.sigstore.json \
            --certificate-identity 'https://github.com/yinghiy13-collab/Sovereign-SEOS-/.github/workflows/seos-runner.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            attestation.json

      - name: Native GitHub attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'attestation.json'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seos-attestation
          path: |
            attestation.json
            attestation.sigstore.json
