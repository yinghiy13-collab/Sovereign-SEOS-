name: Sovereign SEOS Runner

on:
  push:
    branches: [main, master]
    paths:
      - 'seos.py'
      - '.github/workflows/seos-runner.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      command:
        description: 'SEOS command to run'
        required: true
        default: 'self'
        type: choice
        options:
          - self
          - verify
          - math
          - demo
          - ledger
          - sla
          - attest
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref_name }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"
          echo "Command: ${{ inputs.command || 'self (auto)' }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run SEOS Self-Test
        id: run
        run: |
          CMD="${{ inputs.command || 'self' }}"
          python3 "seos.py" "$CMD"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate attestation
        id: attest
        if: steps.run.outcome == 'success'
        run: |
          python3 seos.py attest

      - name: Install cosign
        if: steps.attest.outcome == 'success'
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382 # v3.5.0

      - name: Sign attestation (keyless)
        if: steps.attest.outcome == 'success'
        run: |
          cosign sign-blob --yes attestation.json \
            --bundle attestation.sigstore.json

      - name: Verify attestation (Zero-Trust Check)
        if: steps.attest.outcome == 'success'
        run: |
          echo "Verifying signature against workflow: ${{ github.workflow_ref }}"
          cosign verify-blob \
            --bundle attestation.sigstore.json \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            attestation.json
          echo "✅ Signature is valid and verified!"

      - name: Native GitHub attestation
        if: ${{ !github.event.repository.private && steps.attest.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: 'attestation.json'

      - name: Upload artifacts
        if: steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seos-attestation-${{ github.sha }}
          path: |
            attestation.json
            attestation.sigstore.json
          retention-days: 90

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🛡️ Sovereign SEOS Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Self-Test** | ${{ steps.run.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "| **Trivy Vuln Scan** | ✅ Passed (No High/Critical) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Trivy Vuln Scan** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| **Attestation** | ${{ steps.attest.outcome == 'success' && '✅ Generated' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Reference:** \`${{ github.workflow_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
