name: Sovereign SEOS Debug (tmate)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why debug session?'
        required: false
        default: 'manual debug'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true   # ← CRITICAL: only you can connect
          timeout-minutes: 30

      # Session URL จะอยู่ใน log — คลิกเพื่อเปิด web terminal หรือ copy SSH command
      # เมื่อเสร็จ พิมพ์ `exit` ใน tmate shell
