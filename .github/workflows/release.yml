name: Sovereign SEOS Auto-Release

on:
  push:
    tags:
      - 'v*' # จะทำงานเมื่อมีการ Push Tag ที่ขึ้นต้นด้วย v (เช่น v1.0.0)

permissions:
  contents: write # จำเป็นสำหรับการสร้าง Release
  id-token: write # จำเป็นสำหรับ Cosign Keyless

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEOS Self-Test
        run: python3 seos.py self

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate attestation
        run: python3 seos.py attest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign attestation (keyless)
        run: |
          cosign sign-blob --yes attestation.json \
            --bundle attestation.sigstore.json

      - name: Verify attestation
        run: |
          cosign verify-blob \
            --bundle attestation.sigstore.json \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            attestation.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            attestation.json
            attestation.sigstore.json
            seos.py
