version: 2
updates:
  # ตรวจสอบ GitHub Actions ให้อัปเดต Commit SHA อัตโนมัติ
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"
  # ตรวจสอบ Python dependencies (ถ้ามีในอนาคต)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(python)"
