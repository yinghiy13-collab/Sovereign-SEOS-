version: 2
updates:
  # ตรวจสอบและอัปเดต GitHub Actions (ที่เราปักหมุด SHA ไว้) ให้เป็นเวอร์ชันที่ปลอดภัยที่สุด
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"
      
  # ตรวจสอบ Dependencies ของ Python (ถ้ามีการใช้ requirements.txt ในอนาคต)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(python)"
